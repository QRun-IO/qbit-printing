# Pull request gates (K22-CI-01): Conventional Commit title, DCO sign-off, and
# dependency review, from the shared KofTwentyTwo/standards workflow pinned by SHA
# (K22-CI-11). Dependabot's github-actions ecosystem keeps the pin current.
name: pr-gates

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: KofTwentyTwo/standards/.github/workflows/pr.yml@70b555bd5658273090769991bfc4c9b6681dde18 # v1.2.1
    with:
      # EX-0013: reviewed unmodified H2 2.4.240; docs/H2-LICENSE-REVIEW.md.
      # The required SCA inventory guard enforces the reviewed version because
      # dependency-review's package license matcher ignores PURL versions.
      allow-dependencies-licenses: pkg:maven/com.h2database/h2
    permissions:
      contents: read      # read the commits being merged
      pull-requests: read # read the pull request title and dependency diff
