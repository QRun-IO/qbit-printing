name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_call:
permissions: {}
jobs:
  codeql:
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["java-kotlin", "actions"]'
      build-mode: none
