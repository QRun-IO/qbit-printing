name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_call:
permissions: {}
jobs:
  codeql:
    uses: KofTwentyTwo/standards/.github/workflows/codeql.yml@fdf5ed029603c938615a32b1beca3628b8787945 # v0.1.2
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["java-kotlin", "actions"]'
      build-mode: none
