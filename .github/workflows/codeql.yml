permissions: {}
jobs:
  codeql:
    uses: KofTwentyTwo/standards/.github/workflows/codeql.yml@70b555bd5658273090769991bfc4c9b6681dde18 # v1.2.1
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["java-kotlin", "actions"]'
      build-mode: none