# Standard QRun release caller (v2, thin contract): every push and manual dispatch delegates to the protected qrun-release-v1 channel. Do not edit per repository.
name: qrun-release
on:
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  release:
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/java-maven.yaml@qrun-release-v1
    with:
      runner: linux-small
      maven-profiles: ui-demo
      fixture-repository: QRun-IO/qqq-print-protocol
      fixture-ref: 42c0d249f81395f00408ec0f92638dcbbf5deb03
      fixture-path: qqq-print-protocol
  postpublish:
    if: ${{ needs.release.outputs.capture == 'true' }}
    needs: release
    permissions:
      contents: write
      actions: write
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/qrun-source-version.yaml@qrun-release-v1
    with:
      runner: linux-small
