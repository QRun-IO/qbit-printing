components:
  schemas:
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
    PrintingAcknowledgmentV1:
      properties:
        accepted:
          type: "boolean"
      required:
      - "accepted"
      type: "object"
    PrintingActionRequestV1:
      properties:
        requestId:
          maxLength: 128
          type: "string"
        issuedAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        action:
          enum:
          - "PAUSE_DISPATCH"
          - "RESUME_DISPATCH"
          - "DISCONNECT"
          - "RECONNECT"
          - "REVOKE"
          - "REFRESH_INVENTORY"
          - "CLEAR_QUEUE"
          - "CANCEL_SPOOL"
          type: "string"
        jobId:
          maxLength: 128
          type: "string"
      required:
      - "requestId"
      - "issuedAt"
      - "action"
      type: "object"
    PrintingActionV1:
      properties:
        commandId:
          maxLength: 128
          type: "string"
        requestId:
          maxLength: 128
          type: "string"
        issuedAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        deviceId:
          maxLength: 128
          type: "string"
        action:
          enum:
          - "PAUSE_DISPATCH"
          - "RESUME_DISPATCH"
          - "DISCONNECT"
          - "RECONNECT"
          - "REVOKE"
          - "REFRESH_INVENTORY"
          - "CLEAR_QUEUE"
          - "CANCEL_SPOOL"
          type: "string"
        status:
          enum:
          - "PENDING"
          - "SUCCEEDED"
          - "FAILED"
          - "EXPIRED"
          - "OUTCOME_UNKNOWN"
          type: "string"
        createdAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        expiresAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        jobId:
          maxLength: 128
          type: "string"
        resultCode:
          maxLength: 80
          type: "string"
        cancelledJobCount:
          type: "integer"
        receipt:
          $ref: "#/components/schemas/PrintingReceiptRequestV1"
      required:
      - "commandId"
      - "requestId"
      - "issuedAt"
      - "deviceId"
      - "action"
      - "status"
      - "createdAt"
      - "expiresAt"
      type: "object"
    PrintingActionsV1:
      properties:
        commands:
          items:
            $ref: "#/components/schemas/PrintingActionV1"
          type: "array"
        nextCursor:
          maxLength: 128
          nullable: true
          type: "string"
      required:
      - "commands"
      - "nextCursor"
      type: "object"
    PrintingClaimV1:
      properties:
        job:
          $ref: "#/components/schemas/PrintingJobV1"
          nullable: true
      required:
      - "job"
      type: "object"
    PrintingCommandV1:
      properties:
        commandId:
          maxLength: 128
          type: "string"
        requestId:
          maxLength: 128
          type: "string"
        action:
          enum:
          - "REFRESH_INVENTORY"
          - "CANCEL_SPOOL"
          type: "string"
        createdAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        expiresAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        jobId:
          maxLength: 128
          type: "string"
      required:
      - "commandId"
      - "requestId"
      - "action"
      - "createdAt"
      - "expiresAt"
      type: "object"
    PrintingControlPollRequestV1:
      properties:
        controlVersion:
          type: "integer"
        agentVersion:
          maxLength: 100
          type: "string"
        capabilities:
          items:
            enum:
            - "REFRESH_INVENTORY"
            - "CANCEL_SPOOL"
            - "printer-media-v1"
            type: "string"
          type: "array"
        lastAppliedRevision:
          type: "integer"
      required:
      - "controlVersion"
      - "agentVersion"
      - "capabilities"
      - "lastAppliedRevision"
      type: "object"
    PrintingControlPollV1:
      properties:
        controlVersion:
          type: "integer"
        serverTime:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        pollIntervalSeconds:
          type: "integer"
        desiredState:
          $ref: "#/components/schemas/PrintingDesiredStateV1"
        commands:
          items:
            $ref: "#/components/schemas/PrintingCommandV1"
          type: "array"
      required:
      - "controlVersion"
      - "serverTime"
      - "pollIntervalSeconds"
      - "desiredState"
      - "commands"
      type: "object"
    PrintingDesiredStateV1:
      properties:
        revision:
          type: "integer"
        dispatchPaused:
          type: "boolean"
        connectionState:
          enum:
          - "CONNECTED"
          - "DISCONNECTED"
          type: "string"
      required:
      - "revision"
      - "dispatchPaused"
      - "connectionState"
      type: "object"
    PrintingEmptyV1:
      type: "object"
    PrintingEnrollmentRequestV1:
      properties:
        enrollmentCode:
          maxLength: 128
          type: "string"
        deviceName:
          maxLength: 1024
          type: "string"
        agentVersion:
          maxLength: 100
          type: "string"
      required:
      - "enrollmentCode"
      - "deviceName"
      - "agentVersion"
      type: "object"
    PrintingEnrollmentV1:
      properties:
        protocolVersion:
          type: "integer"
        deviceId:
          maxLength: 128
          type: "string"
        deviceToken:
          description: "Private device proof, returned once; never log."
          maxLength: 128
          type: "string"
        pollIntervalSeconds:
          type: "integer"
      required:
      - "protocolVersion"
      - "deviceId"
      - "deviceToken"
      - "pollIntervalSeconds"
      type: "object"
    PrintingEventRequestV1:
      properties:
        eventId:
          maxLength: 128
          type: "string"
        status:
          enum:
          - "RECEIVED"
          - "SUBMITTING"
          - "SPOOLED"
          - "SPOOLER_COMPLETED"
          - "FAILED"
          - "OUTCOME_UNKNOWN"
          type: "string"
        message:
          maxLength: 2048
          type: "string"
        spoolerJobId:
          maxLength: 128
          type: "string"
      required:
      - "eventId"
      - "status"
      type: "object"
    PrintingHeartbeatRequestV1:
      properties:
        agentVersion:
          maxLength: 100
          type: "string"
        profile:
          $ref: "#/components/schemas/PrintingProfileV1"
      required:
      - "agentVersion"
      type: "object"
    PrintingHeartbeatV1:
      properties:
        serverTime:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
      required:
      - "serverTime"
      type: "object"
    PrintingInventoryRequestV1:
      properties:
        printers:
          items:
            $ref: "#/components/schemas/PrintingPrinterV1"
          type: "array"
      required:
      - "printers"
      type: "object"
    PrintingJobV1:
      properties:
        jobId:
          maxLength: 128
          type: "string"
        deviceId:
          maxLength: 128
          type: "string"
        printerId:
          maxLength: 128
          type: "string"
        title:
          maxLength: 1024
          type: "string"
        format:
          enum:
          - "PDF"
          - "ZPL"
          type: "string"
        contentSha256:
          maxLength: 64
          type: "string"
        contentLength:
          type: "integer"
        options:
          $ref: "#/components/schemas/PrintingOptionsV1"
        createdAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        status:
          enum:
          - "QUEUED"
          - "CLAIMED"
          - "RECEIVED"
          - "SUBMITTING"
          - "SPOOLED"
          - "SPOOLER_COMPLETED"
          - "FAILED"
          - "OUTCOME_UNKNOWN"
          type: "string"
        message:
          maxLength: 2048
          type: "string"
        spoolerJobId:
          maxLength: 128
          type: "string"
      required:
      - "jobId"
      - "deviceId"
      - "printerId"
      - "title"
      - "format"
      - "contentSha256"
      - "contentLength"
      - "options"
      - "createdAt"
      - "status"
      type: "object"
    PrintingJobsV1:
      properties:
        jobs:
          items:
            $ref: "#/components/schemas/PrintingJobV1"
          type: "array"
      required:
      - "jobs"
      type: "object"
    PrintingMediaProfileV1:
      properties:
        id:
          maxLength: 128
          type: "string"
        revision:
          maxLength: 64
          type: "string"
        name:
          maxLength: 512
          type: "string"
        widthMicrons:
          type: "integer"
        heightMicrons:
          type: "integer"
        dpiX:
          type: "integer"
        dpiY:
          type: "integer"
        source:
          enum:
          - "WINDOWS_QUEUE_DEFAULT"
          type: "string"
        applyMode:
          enum:
          - "DRIVER_DEFAULT"
          type: "string"
      required:
      - "id"
      - "revision"
      - "name"
      - "widthMicrons"
      - "heightMicrons"
      - "dpiX"
      - "dpiY"
      - "source"
      - "applyMode"
      type: "object"
    PrintingMediaSelectionV1:
      properties:
        id:
          maxLength: 128
          type: "string"
        revision:
          maxLength: 64
          type: "string"
      required:
      - "id"
      - "revision"
      type: "object"
    PrintingOperatorCatalogV1:
      properties:
        printers:
          items:
            $ref: "#/components/schemas/PrintingOperatorPrinterV1"
          type: "array"
        nextCursor:
          maxLength: 200
          nullable: true
          type: "string"
      required:
      - "printers"
      - "nextCursor"
      type: "object"
    PrintingOperatorPrinterV1:
      properties:
        printerRowId:
          maxLength: 128
          type: "string"
        deviceId:
          maxLength: 128
          type: "string"
        printerId:
          maxLength: 128
          type: "string"
        name:
          maxLength: 1024
          type: "string"
        deviceName:
          maxLength: 1024
          type: "string"
        description:
          maxLength: 4096
          type: "string"
        location:
          maxLength: 512
          type: "string"
        status:
          maxLength: 40
          type: "string"
        formats:
          items:
            enum:
            - "PDF"
            - "ZPL"
            type: "string"
          type: "array"
        mediaProfiles:
          items:
            $ref: "#/components/schemas/PrintingMediaProfileV1"
          type: "array"
      required:
      - "printerRowId"
      - "deviceId"
      - "printerId"
      - "name"
      - "deviceName"
      - "status"
      - "formats"
      - "mediaProfiles"
      type: "object"
    PrintingOperatorSubmitV1:
      properties:
        requestId:
          maxLength: 128
          type: "string"
        printerRowId:
          maxLength: 128
          type: "string"
        title:
          maxLength: 1024
          type: "string"
        format:
          enum:
          - "PDF"
          - "ZPL"
          type: "string"
        contentBase64:
          maxLength: 2147483647
          type: "string"
        options:
          $ref: "#/components/schemas/PrintingOptionsV1"
      required:
      - "requestId"
      - "printerRowId"
      - "title"
      - "format"
      - "contentBase64"
      type: "object"
    PrintingOptionsV1:
      properties:
        copies:
          type: "integer"
        scale:
          enum:
          - "ACTUAL_SIZE"
          - "FIT"
          type: "string"
        mediaProfile:
          $ref: "#/components/schemas/PrintingMediaSelectionV1"
        paperWidthMm:
          type: "number"
        paperHeightMm:
          type: "number"
      type: "object"
    PrintingPrinterV1:
      properties:
        printerId:
          maxLength: 128
          type: "string"
        name:
          maxLength: 1024
          type: "string"
        driverName:
          maxLength: 1024
          type: "string"
        portName:
          maxLength: 1024
          type: "string"
        status:
          enum:
          - "READY"
          - "OFFLINE"
          - "PAUSED"
          - "ERROR"
          - "UNKNOWN"
          type: "string"
        formats:
          items:
            enum:
            - "PDF"
            - "ZPL"
            type: "string"
          type: "array"
        mediaProfiles:
          items:
            $ref: "#/components/schemas/PrintingMediaProfileV1"
          type: "array"
        displayName:
          maxLength: 512
          type: "string"
        description:
          maxLength: 4096
          type: "string"
        location:
          maxLength: 512
          type: "string"
      required:
      - "printerId"
      - "name"
      - "formats"
      type: "object"
    PrintingProfileV1:
      properties:
        name:
          maxLength: 512
          nullable: true
          type: "string"
        description:
          maxLength: 4096
          nullable: true
          type: "string"
        location:
          maxLength: 512
          nullable: true
          type: "string"
      type: "object"
    PrintingReceiptRequestV1:
      properties:
        receiptId:
          maxLength: 128
          type: "string"
        outcome:
          enum:
          - "INVENTORY_REFRESHED"
          - "CANCEL_REQUESTED"
          - "ALREADY_ABSENT"
          - "OWNERSHIP_MISMATCH"
          - "UNSUPPORTED"
          - "FAILED"
          - "EXPIRED"
          - "OUTCOME_UNKNOWN"
          type: "string"
        completedAt:
          description: "RFC3339 UTC ending in uppercase Z."
          format: "date-time"
          maxLength: 40
          type: "string"
        message:
          maxLength: 1024
          type: "string"
      required:
      - "receiptId"
      - "outcome"
      - "completedAt"
      type: "object"
    PrintingRetryRequestV1:
      properties:
        requestId:
          maxLength: 128
          type: "string"
        confirmDuplicateRisk:
          type: "boolean"
      required:
      - "requestId"
      type: "object"
    PrintingSessionV1:
      properties:
        principalId:
          maxLength: 200
          type: "string"
        tenantId:
          maxLength: 200
          type: "string"
        deviceId:
          maxLength: 128
          type: "string"
      required:
      - "principalId"
      - "tenantId"
      type: "object"
    PrintingTestRequestV1:
      properties:
        requestId:
          maxLength: 128
          type: "string"
        printerId:
          maxLength: 128
          type: "string"
        format:
          enum:
          - "PDF"
          - "ZPL"
          type: "string"
        testProfile:
          maxLength: 40
          type: "string"
      required:
      - "requestId"
      - "printerId"
      - "format"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      description: "The session cookie set by POST /qqq/v1/manageSession (web clients)."
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
    bearerAuth:
      bearerFormat: "JWT or session UUID"
      description: "`Authorization: Bearer <token>`, where the token is either\n-\
        \ an OAuth2 access token (a signed JWT) issued by the app's identity provider\
        \ to the app's client,\n  or to its native client (`values.nativeClientId`\
        \ in GET /qqq/v1/metaData/authentication), for\n  example from the device-authorization\
        \ grant or auth-code + PKCE. It is verified against the\n  provider's keys\
        \ (issuer, audience, expiry, signature) and gives the same user and permissions\n\
        \  as signing in on the web. When it expires (401), refresh it at the provider\
        \ and retry; or\n- a session UUID returned by POST /qqq/v1/manageSession,\
        \ which the server keeps refreshed."
      scheme: "bearer"
      type: "http"
    oauth2:
      description: "The app's OAuth2 / OpenID Connect provider. The real endpoints\
        \ come from the provider's discovery\ndocument: `{values.baseUrl}.well-known/openid-configuration`,\
        \ with values from\nGET /qqq/v1/metaData/authentication. Native clients use\
        \ `values.nativeClientId` (a public client)\nwith auth-code + PKCE (loopback\
        \ or custom-scheme redirect URI registered at the provider) or the\ndevice-authorization\
        \ grant (`device_authorization_endpoint`, RFC 8628), then send the access\
        \ token\nas `Authorization: Bearer`."
      flows:
        authorizationCode:
          authorizationUrl: "/authorize"
          scopes:
            email: "Email address"
            offline_access: "A refresh token, to renew the access token without signing\
              \ in again"
            openid: "OpenID Connect sign-in"
            profile: "Name, username and groups (permissions come from the groups)"
          tokenUrl: "/token"
      type: "oauth2"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "Native current-user printing with secondary device proof, device-control-v1\
    \ and realtime-v1; record, table-list and text printing processes; render to PDF\
    \ with the app header and footer; least-privilege operator catalog and printer-media-v1."
  title: "QQQ Middleware API extension: printing"
  version: "2.3.0"
openapi: "3.0.3"
paths:
  /qqq/v1/qbit/printing/session:
    get:
      description: "Requires the current QQQ user session, printing_admin permission\
        \ and native record access. Device operations additionally require secondary\
        \ device headers bound to this principal. No primary device-bearer authentication."
      operationId: "printingSession"
      parameters:
      - in: "header"
        name: "X-QQQ-Device-Id"
        required: false
        schema:
          maxLength: 36
          type: "string"
      - description: "Private secondary device proof; never log."
        in: "header"
        name: "X-QQQ-Device-Token"
        required: false
        schema:
          maxLength: 128
          type: "string"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid request"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Native QQQ sign-in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission, device proof or user binding denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Record not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintingSessionV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "State or request conflict"
        410:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Request or content expired"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Bounded capacity reached"
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Printing Session"
      tags:
      - "printing"
  /qqq/v1/qbit/printing/device/bind:
    post:
      description: "Requires the current QQQ user session, printing_admin permission\
        \ and native record access. Device operations additionally require secondary\
        \ device headers bound to this principal. No primary device-bearer authentication."
      operationId: "printingBind"
      parameters:
      - in: "header"
        name: "X-QQQ-Device-Id"
        required: true
        schema:
          maxLength: 36
          type: "string"
      - description: "Private secondary device proof; never log."
        in: "header"
        name: "X-QQQ-Device-Token"
        required: true
        schema:
          maxLength: 128
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintingEmptyV1"
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid request"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Native QQQ sign-in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission, device proof or user binding denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Record not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintingAcknowledgmentV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "State or request conflict"
        410:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Request or content expired"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Bounded capacity reached"
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Printing Bind"
      tags:
      - "printing"
  /qqq/v1/qbit/printing/devices/enroll:
    post:
      description: "Requires the current QQQ user session, printing_admin permission\
        \ and native record access. Device operations additionally require secondary\
        \ device headers bound to this principal. No primary device-bearer authentication."
      operationId: "printingEnroll"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintingEnrollmentRequestV1"
        required: true
      responses:
        400:
          content:
            application/json:
